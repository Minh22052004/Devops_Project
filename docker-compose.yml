#
# Requirements:
# 1. Frontend service:
#    - Build from ./frontend directory
#    - Expose port 3000
#    - Pass REACT_APP_API_URL as a build arg (default http://localhost:8080)
#    - Should depend on backend being healthy (condition: service_healthy)
#
# 2. Backend service:
#    - Build from ./backend directory
#    - Expose port 8080
#    - Must have environment variables for database connection
#    - Should depend on postgres and wait for it to be healthy
#    - Add a healthcheck
#
# 3. Postgres service:
#    - Use postgres:15-alpine image
#    - Set POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD from the .env file
#      (copy .env.example to .env; use ${DB_NAME} etc. - no hard-coded passwords)
#    - Publish 5432:5432 so you can run the backend tests from your laptop
#    - Use a named volume for data persistence
#    - Mount the init script from ./database/database.sql
#    - Add a healthcheck
#
# 4. Define named volumes
#
# Hints:
# - Research: "docker-compose healthcheck"
# - Research: "docker-compose depends_on condition"
# - Database env vars for the backend: DB_HOST=postgres, DB_PORT=5432, and DB_NAME / DB_USER / DB_PASSWORD from .env
# - The top-level 'version:' key is obsolete in Compose v2 - do not add it
#
# Example healthcheck:
#   healthcheck:
#      test: ['CMD-SHELL', 'pg_isready -U postgres -d bugdb']
#      interval: 10s
#      timeout: 5s
#      retries: 5
# ===========================================

services:
  # STUDENT TODO: Define frontend service
  frontend:
    build: 
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # TODO: Add ports, depends_on

  # STUDENT TODO: Define backend service
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bugtracker
      DB_USER: bugtracker
      DB_PASSWORD: bugpassword
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # TODO: Add ports, environment, depends_on, healthcheck

  # STUDENT TODO: Define postgres service
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bugtracker
      POSTGRES_USER: bugtracker
      POSTGRES_PASSWORD: bugpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugtracker -d bugtracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    # TODO: Add environment, ports, volumes, healthcheck

# STUDENT TODO: Define named volumes
volumes:
  pgdata:
